<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>سوبي 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc1e3 100%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s ease-in infinite;
      opacity: 0.75;
    }
    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.85;
      }
      100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
      }
    }
    .container {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 26px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(255, 105, 180, 0.35);
      position: relative;
      z-index: 1;
      border: 3px solid #ff69b4;
    }
    .page {
      display: none;
    }
    .page.active {
      display: block;
      animation: fadeIn 0.55s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      color: #d63384;
      font-size: 1.7rem;
      margin-bottom: 18px;
      line-height: 1.45;
    }
    p {
      color: #c2185b;
      font-size: 1.12rem;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .important {
      font-weight: 700;
      font-size: 1.22rem;
      color: #ad1457;
      margin: 22px 0 10px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 28px;
      position: relative;
      min-height: 130px;
      align-items: center;
    }
    .btn {
      padding: 15px 32px;
      font-size: 1.15rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.25s ease;
      box-shadow: 0 5px 18px rgba(0,0,0,0.12);
      min-width: 180px;
    }
    .btn-yes {
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
    }
    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 7px 22px rgba(255, 20, 147, 0.45);
    }
    .btn-no {
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
      color: #ad1457;
      position: relative;
    }
    .date-time-box {
      background: #fff5f8;
      border-radius: 18px;
      padding: 18px 14px;
      margin: 18px 0;
      border: 2px dashed #ff69b4;
    }
    .date-time-box label {
      display: block;
      color: #d63384;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.1rem;
      border: 2px solid #ff69b4;
      border-radius: 14px;
